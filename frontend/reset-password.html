<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password — ApexRX Smart</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/logos/logo-mark.svg">
<link rel="stylesheet" href="css/pharmacies.css">
</head>
<body class="verify-page">
<!-- "Forgot password?" (no token): POST /auth/password/forgot.
     From the reset email (#token=...): POST /auth/password/reset. js/reset-password.js -->
<header><a class="brand" href="index.html"><img src="assets/logos/logo-mark.svg" alt="" width="38"><span>ApexRX<span class="green"> Smart</span><small>Smarter access. Better health.</small></span></a><a class="home-link" href="index.html">← Back to website</a><label class="language-control"><span class="sr-only">Language</span><select id="workflow-language" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="rw">Kinyarwanda</option></select></label></header>
<main class="verify-main">
<section class="workspace access-card" aria-labelledby="reset-title">
<div class="mail-icon" id="reset-icon" aria-hidden="true">✉</div>
<h2 id="reset-title" tabindex="-1">Forgot your password?</h2>
<p id="reset-message" class="muted" role="status">Enter the email address of your ApexRX account. We will email you a link to choose a new password.</p>

<form id="forgot-form" hidden novalidate>
<label>Email address<input name="email" type="email" autocomplete="email" required></label>
<button class="primary" id="forgot-submit">Email me a reset link <span>→</span></button>
</form>

<form id="reset-form" hidden novalidate>
<p class="note"><span>New password for</span> <strong id="reset-email"></strong></p>
<label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label>
<label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Re-enter your password" required></label>
<button class="primary" id="reset-submit">Change my password <span>→</span></button>
</form>

<div class="actions" id="reset-actions">
<a class="secondary" id="back-to-signin" href="pharmacies.html#signin">← Back to sign in</a>
</div>
<p id="form-error" role="alert"></p>
</section>
</main>
<script src="js/pharmacies-i18n.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/reset-password.js"></script>
<script src="js/password-toggle.js"></script>
</body></html>
